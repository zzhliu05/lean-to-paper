[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-to-paper"
version = "0.1.0"
description = "Source-grounded Lean declaration dependency graphs for mathematical exposition"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
lean-to-paper = "lean_to_paper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lean_to_paper = ["viewer.html", "progress.html", "explorer.html", "static_data.js"]
