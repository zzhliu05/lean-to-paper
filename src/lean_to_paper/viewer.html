<!doctype html><html lang="zh-CN"><meta charset="utf-8">
<title>Lean 声明候选依赖图</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#222;background:#fafafa;font:14px system-ui,sans-serif}header{padding:22px 28px;background:white;border-bottom:1px solid #ddd}h1{font-size:24px;margin:0 0 10px}p{line-height:1.6;margin:6px 0}.muted{color:#666}input{padding:9px;width:min(620px,100%);border:1px solid #bbb;border-radius:5px}main{display:grid;grid-template-columns:1fr 370px;height:75vh}#canvas{overflow:auto;min-height:450px}aside{padding:20px;border-left:1px solid #ddd;background:#fff;overflow:auto;overflow-wrap:anywhere}svg{background:#fafafa}rect{fill:white;stroke:#aaa;rx:5}.root rect{stroke:#111;stroke-width:2}.selected rect{fill:#eaf4ff;stroke:#2261a5}.dim{opacity:.12}text{font:11px ui-monospace,monospace;pointer-events:none}path{fill:none;stroke:#b1b6be;stroke-dasharray:4 3;marker-end:url(#arrow)}.edge-selected{stroke:#2261a5;stroke-width:2}g.node{cursor:pointer}pre{white-space:pre-wrap;font-size:12px;line-height:1.6;background:#f4f4f4;padding:12px}button{padding:8px;margin:6px 3px;border:1px solid #bbb;background:white;cursor:pointer}li{margin:10px 0}.badge{font-size:12px;background:#eee;padding:3px 6px}#status{margin:8px 0}a{color:#2261a5} @media(max-width:800px){main{display:block}aside{border-top:1px solid #ddd}#canvas{height:60vh}}
</style>
<header><h1>Lean 声明候选依赖图</h1><p>箭头：声明 → 它引用的声明。虚线为源码候选关系，尚未经过 Lean 内核验证。</p><p class="muted">这是限深预览；完整已发现候选图在 candidate-nodes.jsonl / candidate-edges.jsonl 中。基础定理保留，数学难度尚未分类。</p><input id="search" placeholder="按声明名称筛选；点击节点查看来源及候选依赖"><div id="status"></div><button id="zoomIn">放大</button><button id="zoomOut">缩小</button><button id="reset">重置</button></header>
<main><div id="canvas"><svg id="graph" xmlns="http://www.w3.org/2000/svg"></svg></div><aside id="detail"><h2>选择一个声明</h2><p>点击节点查看声明头、源码位置、引用阶段和解析依据。</p></aside></main>
<script id="data" type="application/json">__GRAPH_DATA__</script>
<script>
const data=JSON.parse(document.getElementById('data').textContent),nodes=new Map(data.nodes.map(n=>[n.id,n]));
const svg=document.getElementById('graph'),NS='http://www.w3.org/2000/svg';let scale=1;
function el(tag,attrs,parent=svg){const e=document.createElementNS(NS,tag);for(const [k,v]of Object.entries(attrs))e.setAttribute(k,v);parent.appendChild(e);return e;}
const defs=el('defs',{}),marker=el('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'},defs);el('polygon',{points:'0,0 10,5 0,10',fill:'#888'},marker);
const depth=new Map(data.nodes.filter(n=>n.root).map(n=>[n.id,0]));let frontier=[...depth.keys()];
for(let i=0;i<data.view_depth;i++){const next=[];for(const s of frontier)for(const e of data.edges)if(e.source===s&&!depth.has(e.target)){depth.set(e.target,i+1);next.push(e.target);}frontier=next;}
const columns=[];for(const n of data.nodes){const d=depth.get(n.id)||0;(columns[d]??=[]).push(n);}
const positions=new Map();columns.forEach((col,i)=>col.forEach((n,j)=>positions.set(n.id,{x:30+i*360,y:45+j*75})));
const W=columns.length*360+40,H=Math.max(2,...columns.map(c=>c.length))*75+70;
svg.setAttribute('viewBox',`0 0 ${W} ${H}`);function zoom(){svg.setAttribute('width',W*scale);svg.setAttribute('height',H*scale);}zoom();
const edgeElements=[];for(const e of data.edges){const a=positions.get(e.source),b=positions.get(e.target);if(!a||!b)continue;const x=a.x+300,y=a.y+22;const p=el('path',{d:`M${x},${y} C${x+40},${y} ${b.x-40},${b.y+22} ${b.x},${b.y+22}`});edgeElements.push([e,p]);}
const nodeElements=new Map();for(const n of data.nodes){const p=positions.get(n.id),g=el('g',{class:'node'+(n.root?' root':''),transform:`translate(${p.x},${p.y})`});el('rect',{width:300,height:45},g);const t=el('text',{x:10,y:19},g);t.textContent=n.name.length>43?'…'+n.name.slice(-42):n.name;const sub=el('text',{x:10,y:35,fill:'#777'},g);sub.textContent=n.kind+' · line '+n.line+(data.frontier.includes(n.id)?' · 预览边界':'');const title=el('title',{},g);title.textContent=n.name;g.onclick=()=>select(n.id);nodeElements.set(n.id,g);}
function select(id){const n=nodes.get(id);for(const [did,g]of nodeElements)g.classList.toggle('selected',did===id);for(const[e,p]of edgeElements)p.classList.toggle('edge-selected',e.source===id);const panel=document.getElementById('detail');panel.replaceChildren();function text(tag,value){const e=document.createElement(tag);e.textContent=value;panel.appendChild(e);return e;}text('h2',n.name);text('p',n.path+':'+n.line);text('pre',n.header);text('p','难度：'+n.education_level+'；文章策略：'+n.article_action+'。');const refs=data.edges.filter(e=>e.source===id);text('h3','当前视图内的候选引用（'+refs.length+'）');for(const e of refs){const b=text('button',nodes.get(e.target).name);b.onclick=()=>select(e.target);text('p',e.phase+' · '+e.evidence+' · 第 '+e.line+' 行');}if(data.frontier.includes(id))text('p','此节点位于预览深度边界；完整关系请查询 SQLite。');}
document.getElementById('search').oninput=e=>{const q=e.target.value.toLowerCase();for(const[id,g]of nodeElements)g.classList.toggle('dim',q&&!nodes.get(id).name.toLowerCase().includes(q));};
document.getElementById('zoomIn').onclick=()=>{scale=Math.min(3,scale*1.2);zoom();};document.getElementById('zoomOut').onclick=()=>{scale=Math.max(.2,scale/1.2);zoom();};document.getElementById('reset').onclick=()=>{scale=1;zoom();document.getElementById('search').value='';for(const g of nodeElements.values())g.classList.remove('dim');};
document.getElementById('status').textContent=`预览 ${data.nodes.length} 个节点 / ${data.edges.length} 条候选边 · 深度 ${data.view_depth} · 边界节点 ${data.frontier.length}`;
</script></html>
