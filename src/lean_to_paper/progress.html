<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Lean 声明依赖图 · 实时进度</title>
<style>body{font:16px system-ui,sans-serif;background:#f7f8fa;color:#17202a;margin:0;padding:36px}main{max-width:1100px;margin:auto}h1{font-size:28px}p{color:#657080;line-height:1.7}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:30px 0}.card{padding:26px;background:white;border:1px solid #e1e5eb;border-radius:12px}.label{font-size:14px;color:#687483}.value{font-size:35px;font-weight:650;margin:12px 0;letter-spacing:-1px}progress{width:100%;height:24px;accent-color:#2563eb}#status{display:inline-block;background:#eaf2ff;color:#1859b8;padding:7px 12px;border-radius:20px}.chart{background:white;border:1px solid #e1e5eb;border-radius:12px;padding:24px;margin-top:24px}svg{width:100%;height:150px}small{color:#687483}#error{color:#b42318}@media(max-width:800px){body{padding:20px}.cards{grid-template-columns:1fr}.value{font-size:30px}}</style>
<main><h1>Lean 声明依赖图 · 实时进度</h1><p>每 3 秒从本机数据库读取一次。当前任务：<span id="scope">读取任务范围…</span>。</p><div id="status">正在读取…</div><div class="cards"><div class="card"><div class="label">已展开声明</div><div class="value" id="expanded">—</div><small id="total">读取全项目声明数…</small></div><div class="card"><div class="label">已保存候选引用记录</div><div class="value" id="edges">—</div><small>区分声明条件与证明中的引用</small></div><div class="card"><div class="label">近期处理速度</div><div class="value" id="rate">—</div><small>声明 / 秒；按已提交的数据库记录计算</small></div></div><progress id="bar" max="100" value="0"></progress><p><strong id="coverage">—</strong> <span id="coverage-note">全项目目录覆盖率。</span></p><div class="chart"><div class="label">近期处理速度</div><svg viewBox="0 0 1000 150" preserveAspectRatio="none"><polyline id="line" points="" fill="none" stroke="#2563eb" stroke-width="2" vector-effect="non-scaling-stroke"/></svg><small id="updated">等待第一次更新</small></div><p id="error"></p><p>边为源码词法候选引用，尚未经过 Lean 内核验证。基础声明保留在图中，文章层按难度策略决定是否省略证明。</p></main>
<script>
let previous=null,history=[];const fmt=n=>n.toLocaleString('zh-CN');
async function refresh(){try{const response=await fetch('/api/progress',{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const d=await response.json();document.getElementById('scope').textContent=d.expansion_scope==='entire_project'?'全项目所有声明的候选引用展开':'Main.lean 五个入口声明的候选引用闭包';const now=performance.now(),rate=previous?Math.max(0,(d.expanded-previous.count)*1000/(now-previous.time)):null;document.getElementById('expanded').textContent=fmt(d.expanded);document.getElementById('total').textContent='全项目 '+fmt(d.declarations)+' 条声明';document.getElementById('edges').textContent=fmt(d.edges);document.getElementById('rate').textContent=rate===null?'采样中':fmt(Math.round(rate));const ratio=100*d.expanded/d.declarations;document.getElementById('bar').value=ratio;document.getElementById('coverage').textContent=ratio.toFixed(2)+'%';document.getElementById('coverage-note').textContent=d.expansion_scope==='entire_project'?'全项目候选引用展开进度。':'全项目目录覆盖率；入口闭包的最终声明数尚未知。';document.getElementById('status').textContent=d.candidate_closure_complete?'候选闭包展开完成':'正在展开候选依赖';if(rate!==null){history.push(rate);if(history.length>80)history.shift();const max=Math.max(1,...history);document.getElementById('line').setAttribute('points',history.map((x,i)=>`${i*1000/79},${145-x*130/max}`).join(' '));}document.getElementById('updated').textContent='最近更新：'+new Date().toLocaleTimeString('zh-CN',{timeZone:'Asia/Shanghai'})+'（北京时间）';document.getElementById('error').textContent='';previous={count:d.expanded,time:now};}catch(e){document.getElementById('error').textContent='暂时无法更新：'+e.message;}finally{setTimeout(refresh,3000);}}refresh();
</script></html>
